[package]
name = "dw1"
description = "Digimon World as a native Apple Silicon app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
backend = { version = "0.1.0", path = "../backend" }
decomp-c = { path = "../decomp-c" }
libc = "0.2"
pack = { path = "../pack" }
png = "0.17"
psyq = { path = "../psyq" }
render = { path = "../render" }
sha1_smol = "1"
sdl3 = { version = "0.20.0", default-features = false, features = ["build-from-source-static", "raw-window-handle"] }
